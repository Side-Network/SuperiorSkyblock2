# Whether the module should be enabled.
# When disabled, all module commands and features will also be disabled.
enabled: true

# Should mission rewards be automatically claimed outside island worlds?
# When disabled, rewards for missions with auto-reward enabled will be
# automatically claimed only in island worlds.
auto-reward-outside-islands: false

# Multipliers based on the island's peak (historical max) member count.
peak-member-multipliers: {}
#  '1': 0.3
#  '2': 1.5
#  '5': 2.0

# Settings related to mission categories.
# A tutorial about configuring missions can be found here:
# https://wiki.bg-software.com/superiorskyblock/missions
categories:
  miner:
    name: 'Miner'
    slot: 20

  slayer:
    name: 'Slayer'
    slot: 21

  farmer:
    name: 'Farmer'
    slot: 22

  fisherman:
    name: 'Fisherman'
    slot: 23

  explorer:
    name: 'Explorer'
    slot: 24

icons:
  complete-previous:
    type: RED_CANDLE
    name: '&c&lLocked Mission'
    amount:
    lore:
      - '&7Complete all previous missions'
      - '&7to unlock this mission!'
  locked-until:
    type: BEDROCK
    name: '&c&lLocked Mission'
    amount:
    lore:
      - '&7Locked until &f{0}'
      - ''
      - '&fUnlocks in: &c{1}'
